name: CI

# Keep actions pinned to commit hashes; update the accompanying version comments.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-cache:
    name: Nix checks (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1

      - name: Free disk space for Nix builds
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          # Finish deleting /opt/hostedtoolcache before niks3 installs its hook there.
          witness-carnage: true

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            fallback = true
            accept-flake-config = true
            max-jobs = 1
            system = x86_64-linux

      # The action configures cache reads and uploads completed derivations via OIDC.
      # Fork pull requests can read the cache without receiving upload credentials.
      - name: Configure the niks3 binary cache
        uses: Mic92/niks3-action@12d3e320b2a99b7938f9634bd337cd9fec104609 # v1.1.0
        with:
          server-url: https://niks3.s.ihavenojob.work

      - name: Run Nix checks
        run: nix flake check --print-build-logs

      - name: Collect generated processor sources
        run: nix build .#processor --out-link processor --print-build-logs

      - name: Upload generated processor sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: processor-x86_64-linux
          path: processor/
          if-no-files-found: error
