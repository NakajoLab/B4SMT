name: CI

# Keep actions pinned to commit hashes; update the accompanying version comments.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-cache:
    name: Nix checks (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Configure the niks3 binary cache
        uses: Mic92/niks3-action@53fc4d8be8e7f3693e1a6be91eede40590b0d1d2 # v1.12.0
        with:
          server-url: https://niks3.s.ihavenojob.work

      - name: Run Nix checks
        run: nix flake check --print-build-logs

      - name: Collect generated processor sources
        run: nix build .#processor --out-link processor --print-build-logs

      - name: Upload generated processor sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: processor-x86_64-linux
          path: processor/
          if-no-files-found: error
